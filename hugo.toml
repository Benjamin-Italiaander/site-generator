baseURL = "https://tlnd.org/"
title = "Benjamin Italiaander"
# Theme: github-style + our notes layer (themes/notes-github).
theme = ["notes-github", "github-style"]
# static_notes/ is generated by fill_site.sh (images, pdfs, ... from My_Notes)
staticDir = ["static", "static_notes"]
languageCode = "en"
defaultContentLanguage = "en"
disablePathToLower = true

# The tabs are generated from the My_Notes folders.

[pagination]
pagerSize = 20

[markup.highlight]
style = "github-dark"
noClasses = false      # colours come from the theme's CSS (light + dark mode)

# home page also gets index.json, used by the search box (github-style)
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
  author = "Benjamin Italiaander"
  description = "Linux fanatic · Network engineer · Open infrastructure & local AI enthusiast. Building the infrastructure that should already exist."
  keywords = "python, keras, Bash, kitty, kitten"

  # --- github-style ---
  github = "Benjamin-Italiaander"
  linkedin = "italiaander"        # shown in the sidebar under Organizations
  avatar = "/avatar.png"
  headerIcon = "/images/icon-192.png"
  favicon = "/img/favicon-32x32.png"
  userStatusEmoji = "🐧"
  url = "https://tlnd.org"
  rss = true
  lastmod = false
  enableSearch = true
  custom_css = ["css/notes-github.css"]
  # customSCSS = ["scss/custom.scss"]
  # customJS = ["js/custom.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

# Social links
[[params.social]]
  name = "Github"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/Benjamin-Italiaander"
[[params.social]]
  name = "Gitlab"
  icon = "fa-brands fa-gitlab fa-2x"
  weight = 2
  url = "https://gitlab.com/italiaander"

# Extra profile links (github-style sidebar)
[[params.links]]
  title = "Gitlab"
  href = "https://gitlab.com/italiaander"

# Pinned pages on the home page (github-style). For each pin, give the English
# and the Dutch page. If one page holds both languages, use the same path twice.
[[params.pinned]]
  en = "/slices_of_life/reminders/modern_love/en"
  nl = "/slices_of_life/reminders/modern_love/nl"
[[params.pinned]]
  en = "/slices_of_life/reminders/how_to_say_no/en"
  nl = "/slices_of_life/reminders/how_to_say_no/nl"
[[params.pinned]]
  en = "/slices_of_life/art_i_enjoy"
  nl = "/slices_of_life/art_i_enjoy/nl"
[[params.pinned]]
  en = "/slices_of_life/quotes_for_life/011_the_meaning_of_events/en"
  nl = "/slices_of_life/quotes_for_life/011_the_meaning_of_events/nl"

[markup.goldmark.renderer]
  unsafe = true   # notes contain raw HTML (<img>, <details>, ...)
